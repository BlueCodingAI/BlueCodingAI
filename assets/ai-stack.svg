<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="t d">
  <title id="t">AI toolkit</title>
  <desc id="d">LLMs, RAG, AI agents, LangChain, Ollama, vector search.</desc>
  <style>
  .ch{animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .dt{transform-box:fill-box;transform-origin:center;animation:dt 2s ease-in-out infinite}
  @keyframes dt{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.2);opacity:1}}
  .sw{animation:sw 4.5s ease-in-out infinite}
  @keyframes sw{0%{transform:translateX(-200px)}70%,100%{transform:translateX(1300px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <clipPath id="chips"><rect x="124" y="14" width="106" height="48" rx="24.0"/><rect x="246" y="14" width="94" height="48" rx="24.0"/><rect x="356" y="14" width="165" height="48" rx="24.0"/><rect x="537" y="14" width="165" height="48" rx="24.0"/><rect x="718" y="14" width="129" height="48" rx="24.0"/><rect x="863" y="14" width="213" height="48" rx="24.0"/></clipPath>
    <linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#e0f2fe" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <g class="ch" style="animation-delay:-0.0s"><rect x="124" y="14" width="106" height="48" rx="24.0" fill="#0a1226" stroke="#22d3ee" stroke-opacity=".55"/><circle class="dt" style="animation-delay:-0.0s" cx="148" cy="38.0" r="5" fill="#22d3ee"/><text x="162" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">LLMs</text></g><g class="ch" style="animation-delay:-0.5s"><rect x="246" y="14" width="94" height="48" rx="24.0" fill="#0a1226" stroke="#38bdf8" stroke-opacity=".55"/><circle class="dt" style="animation-delay:-0.4s" cx="270" cy="38.0" r="5" fill="#38bdf8"/><text x="284" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">RAG</text></g><g class="ch" style="animation-delay:-1.0s"><rect x="356" y="14" width="165" height="48" rx="24.0" fill="#0a1226" stroke="#3b82f6" stroke-opacity=".55"/><circle class="dt" style="animation-delay:-0.8s" cx="380" cy="38.0" r="5" fill="#3b82f6"/><text x="394" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">AI Agents</text></g><g class="ch" style="animation-delay:-1.5s"><rect x="537" y="14" width="165" height="48" rx="24.0" fill="#0a1226" stroke="#6366f1" stroke-opacity=".55"/><circle class="dt" style="animation-delay:-1.2s" cx="561" cy="38.0" r="5" fill="#6366f1"/><text x="575" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">LangChain</text></g><g class="ch" style="animation-delay:-2.0s"><rect x="718" y="14" width="129" height="48" rx="24.0" fill="#0a1226" stroke="#a78bfa" stroke-opacity=".55"/><circle class="dt" style="animation-delay:-1.6s" cx="742" cy="38.0" r="5" fill="#a78bfa"/><text x="756" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Ollama</text></g><g class="ch" style="animation-delay:-2.5s"><rect x="863" y="14" width="213" height="48" rx="24.0" fill="#0a1226" stroke="#22d3ee" stroke-opacity=".55"/><circle class="dt" style="animation-delay:-2.0s" cx="887" cy="38.0" r="5" fill="#22d3ee"/><text x="901" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Vector Search</text></g>
  <g clip-path="url(#chips)"><rect class="sw" x="0" y="0" width="160" height="76" fill="url(#sg)"/></g>
</svg>
