<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="t d">
  <title id="t">From idea to production</title>
  <desc id="d">Seven-step workflow: Discover, Architect, Build, Test, Deploy, Observe, Improve, with a loop from Improve back to Architect.</desc>
  <style>
  
  .wrun{animation:wrun 12s linear infinite;filter:drop-shadow(0 0 4px #22d3ee)}
  @keyframes wrun{to{stroke-dashoffset:-2934.2}}

  .halo{transform-box:fill-box;transform-origin:center;opacity:0}
  .fill{opacity:0}
  @keyframes hit{0%{opacity:.0}1%{opacity:.9}14%{opacity:0}100%{opacity:0}}
  .halo.n0,.halo.n1,.halo.n2,.halo.n3,.halo.n4,.halo.n5,.halo.n6{animation-name:halo}
  @keyframes halo{0%{transform:scale(1);opacity:0}1%{opacity:.9}16%{transform:scale(1.6);opacity:0}100%{opacity:0}}
  .n0{animation:hit 8.4s linear infinite;animation-delay:0.00s}.n1{animation:hit 8.4s linear infinite;animation-delay:1.17s}.n2{animation:hit 8.4s linear infinite;animation-delay:2.33s}.n3{animation:hit 8.4s linear infinite;animation-delay:3.50s}.n4{animation:hit 8.4s linear infinite;animation-delay:4.67s}.n5{animation:hit 8.4s linear infinite;animation-delay:5.83s}.n6{animation:hit 8.4s linear infinite;animation-delay:7.00s}
  .fill.n0,.fill.n1,.fill.n2,.fill.n3,.fill.n4,.fill.n5,.fill.n6{animation-name:fillp}
  @keyframes fillp{0%{opacity:0}1%{opacity:.28}14%,100%{opacity:0}}
  .loop{stroke-dasharray:7 9;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-16}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="track" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="pg" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g clip-path="url(#wclip)">
  
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0b1430"/>
    </linearGradient>
    <linearGradient id="wrun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wclip"><rect width="1200" height="290" rx="22"/></clipPath>
    <pattern id="wgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="290" rx="22" fill="url(#wbg)"/>
  <rect width="1200" height="290" rx="22" fill="url(#wgrid)"/>
  <rect x="1" y="1" width="1198" height="288" rx="22" fill="none" stroke="#1f2a44" stroke-width="1.5"/>
  <rect class="wrun" x="1" y="1" width="1198" height="288" rx="22" fill="none" stroke="#22d3ee"
        stroke-width="2" stroke-linecap="round" stroke-dasharray="280 2654.2"/>

  </g>
  <line x1="110" y1="160" x2="1090" y2="160" stroke="url(#track)" stroke-opacity=".35" stroke-width="3"/>
  <path class="loop" d="M1090 126 C1090 34 273 34 273 126" fill="none" stroke="#a78bfa" stroke-opacity=".7" stroke-width="2"/>
  <path d="M267 114 l6 10 6 -10" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="532" y="44" width="300" height="26" rx="13" fill="#0a1226" stroke="#1f2a44"/>
  <text x="682" y="62" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#a78bfa">CONTINUOUS IMPROVEMENT LOOP</text>
  <g>
    <circle r="10" fill="#22d3ee" filter="url(#pg)" opacity=".9"/><circle r="4.5" fill="#ecfeff"/>
    <animateMotion dur="8.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.8333;1"
      path="M110 160 H1090"/>
  </g>
  <g>
    <circle r="3.5" fill="#a78bfa"/>
    <animateMotion dur="4s" repeatCount="indefinite" path="M1090 126 C1090 34 273 34 273 126"/>
  </g>
  <g>
      <circle class="halo n0" cx="110" cy="160" r="34" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="110" cy="160" r="30" fill="#0a1226" stroke="url(#ng)" stroke-width="2"/>
      <circle class="fill n0" cx="110" cy="160" r="30" fill="#22d3ee"/>
      <text x="110" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">01</text>
      <text x="110" y="222" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Discover</text>
      <text x="110" y="244" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#94a3b8">the real problem</text>
    </g><g>
      <circle class="halo n1" cx="273" cy="160" r="34" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="273" cy="160" r="30" fill="#0a1226" stroke="url(#ng)" stroke-width="2"/>
      <circle class="fill n1" cx="273" cy="160" r="30" fill="#22d3ee"/>
      <text x="273" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">02</text>
      <text x="273" y="222" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Architect</text>
      <text x="273" y="244" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#94a3b8">smallest robust design</text>
    </g><g>
      <circle class="halo n2" cx="437" cy="160" r="34" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="437" cy="160" r="30" fill="#0a1226" stroke="url(#ng)" stroke-width="2"/>
      <circle class="fill n2" cx="437" cy="160" r="30" fill="#22d3ee"/>
      <text x="437" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">03</text>
      <text x="437" y="222" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Build</text>
      <text x="437" y="244" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#94a3b8">clean, typed code</text>
    </g><g>
      <circle class="halo n3" cx="600" cy="160" r="34" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="600" cy="160" r="30" fill="#0a1226" stroke="url(#ng)" stroke-width="2"/>
      <circle class="fill n3" cx="600" cy="160" r="30" fill="#22d3ee"/>
      <text x="600" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">04</text>
      <text x="600" y="222" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Test</text>
      <text x="600" y="244" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#94a3b8">validate early</text>
    </g><g>
      <circle class="halo n4" cx="763" cy="160" r="34" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="763" cy="160" r="30" fill="#0a1226" stroke="url(#ng)" stroke-width="2"/>
      <circle class="fill n4" cx="763" cy="160" r="30" fill="#22d3ee"/>
      <text x="763" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">05</text>
      <text x="763" y="222" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Deploy</text>
      <text x="763" y="244" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#94a3b8">CI/CD to cloud</text>
    </g><g>
      <circle class="halo n5" cx="927" cy="160" r="34" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="927" cy="160" r="30" fill="#0a1226" stroke="url(#ng)" stroke-width="2"/>
      <circle class="fill n5" cx="927" cy="160" r="30" fill="#22d3ee"/>
      <text x="927" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">06</text>
      <text x="927" y="222" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Observe</text>
      <text x="927" y="244" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#94a3b8">metrics &amp; logs</text>
    </g><g>
      <circle class="halo n6" cx="1090" cy="160" r="34" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="1090" cy="160" r="30" fill="#0a1226" stroke="url(#ng)" stroke-width="2"/>
      <circle class="fill n6" cx="1090" cy="160" r="30" fill="#22d3ee"/>
      <text x="1090" y="166" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">07</text>
      <text x="1090" y="222" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Improve</text>
      <text x="1090" y="244" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#94a3b8">iterate with data</text>
    </g>
</svg>
