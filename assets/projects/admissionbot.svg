<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="t d">
  <title id="t">AdmissionBot — Chat + Voice Assistant</title>
  <desc id="d">Answers admission questions grounded in the official CET information brochure, by chat or by voice, with speech-to-text and spoken replies. Stack: Next.js, TypeScript, Tailwind, OpenAI, Whisper, TTS.</desc>
  <style>
  
  .pins{stroke-dasharray:3 3;animation:pins 1.4s linear infinite}
  @keyframes pins{to{stroke-dashoffset:-12}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pz 2.2s ease-in-out infinite}
  @keyframes pz{0%,100%{transform:scale(.8);opacity:.7}50%{transform:scale(1.15);opacity:1}}
  .lay1{animation:l1 3s ease-in-out infinite}.lay2{animation:l2 3s ease-in-out infinite}
  @keyframes l1{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes l2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .gear{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bolt{animation:flash 2.4s ease-in-out infinite}
  @keyframes flash{0%,100%{opacity:.4}40%,60%{opacity:1}}
  .up{animation:up 1.8s ease-in infinite}
  @keyframes up{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
  .dot{animation:dot 1.2s ease-in-out infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
  @keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
  .lvl{transform-box:fill-box;transform-origin:bottom;animation:lvl .9s ease-in-out infinite alternate}
  @keyframes lvl{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  .draw{stroke-dasharray:100;animation:draw 3.2s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:100}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
  .move{animation:mv 4s ease-in-out infinite}
  @keyframes mv{0%,15%{transform:translate(0,0)}40%,60%{transform:translate(16px,8px)}85%,100%{transform:translate(32px,22px)}}

  
  .wv{transform-box:fill-box;transform-origin:center;animation:wv 1s ease-in-out infinite alternate}
  @keyframes wv{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
  .arrow{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  .sheen{animation:sheen 7s ease-in-out infinite}
  @keyframes sheen{0%,60%{transform:translateX(-600px)}100%{transform:translateX(600px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0b1430"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".22"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <clipPath id="clip"><rect width="600" height="330" rx="22"/></clipPath>
    <linearGradient id="iib" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12224a"/><stop offset="1" stop-color="#0a1226"/></linearGradient>
    <linearGradient id="psb" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset=".35" stop-color="#1f2a44"/><stop offset=".65" stop-color="#1f2a44"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".9"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/></linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="600" height="330" fill="url(#bg)"/>
    <rect width="600" height="330" fill="url(#glow)"/>
    <rect class="sheen" width="360" height="330" fill="url(#sh)" transform="skewX(-12)"/>
  </g>
  <rect x="1" y="1" width="598" height="328" rx="22" fill="none" stroke="url(#psb)" stroke-width="1.6"/>
  <g transform="translate(28 28)"><rect width="60" height="60" rx="15" fill="url(#iib)" stroke="#22314f"/><g transform="scale(0.938)"><rect x="24" y="10" width="16" height="28" rx="8" fill="none" stroke="#22d3ee" stroke-width="2.4"/>
      <path d="M17 30a15 15 0 0 0 30 0M32 45v8M25 53h14" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
      <rect class="lvl" x="28" y="20" width="8" height="14" rx="4" fill="#22d3ee"/></g></g>
  <text x="106" y="58" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#22d3ee">CHAT + VOICE ASSISTANT</text><text x="106" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="30" font-weight="800" fill="#e2e8f0">AdmissionBot</text>
  <g transform="translate(390 28)">
        <rect width="182" height="96" rx="14" fill="#08102a" stroke="#22314f"/>
        <rect class="wv" style="animation-delay:-0.00s;animation-duration:0.80s" x="12.0" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.13s;animation-duration:0.92s" x="21.6" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.26s;animation-duration:1.04s" x="31.2" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.39s;animation-duration:1.16s" x="40.8" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.52s;animation-duration:1.28s" x="50.4" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.65s;animation-duration:0.80s" x="60.0" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.78s;animation-duration:0.92s" x="69.6" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.91s;animation-duration:1.04s" x="79.2" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-1.04s;animation-duration:1.16s" x="88.8" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.07s;animation-duration:1.28s" x="98.4" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.20s;animation-duration:0.80s" x="108.0" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.33s;animation-duration:0.92s" x="117.6" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.46s;animation-duration:1.04s" x="127.2" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.59s;animation-duration:1.16s" x="136.8" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.72s;animation-duration:1.28s" x="146.4" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.85s;animation-duration:0.80s" x="156.0" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/><rect class="wv" style="animation-delay:-0.98s;animation-duration:0.92s" x="165.6" y="22" width="5" height="52" rx="2.5" fill="url(#wv)"/>
      </g>
  <text x="28" y="140" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" fill="#94a3b8">Answers admission questions grounded in the official</text><text x="28" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" fill="#94a3b8">CET information brochure, by chat or by voice, with</text><text x="28" y="191" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="17" fill="#94a3b8">speech-to-text and spoken replies.</text>
  <g class="" style="animation-delay:0.00s"><rect x="28" y="230" width="81" height="28" rx="14.0" fill="#0f1a33" stroke="#22314f"/><text x="41" y="248.7" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#cbd5e1">Next.js</text></g><g class="" style="animation-delay:0.45s"><rect x="117" y="230" width="104" height="28" rx="14.0" fill="#0f1a33" stroke="#22314f"/><text x="130" y="248.7" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#cbd5e1">TypeScript</text></g><g class="" style="animation-delay:0.90s"><rect x="229" y="230" width="88" height="28" rx="14.0" fill="#0f1a33" stroke="#22314f"/><text x="242" y="248.7" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#cbd5e1">Tailwind</text></g><g class="" style="animation-delay:1.35s"><rect x="325" y="230" width="73" height="28" rx="14.0" fill="#0f1a33" stroke="#22314f"/><text x="338" y="248.7" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#cbd5e1">OpenAI</text></g><g class="" style="animation-delay:1.80s"><rect x="406" y="230" width="81" height="28" rx="14.0" fill="#0f1a33" stroke="#22314f"/><text x="419" y="248.7" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#cbd5e1">Whisper</text></g><g class="" style="animation-delay:2.25s"><rect x="494" y="230" width="49" height="28" rx="14.0" fill="#0f1a33" stroke="#22314f"/><text x="507" y="248.7" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#cbd5e1">TTS</text></g>
  <text x="28" y="302" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="15" font-weight="700" fill="#22d3ee">View repository<tspan class="arrow" dx="6">→</tspan></text>
</svg>
