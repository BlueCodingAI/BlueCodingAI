# Draws your real contribution graph as an animated "snake" (blue theme).
# The images are saved to a branch called `output` in this repo, so they never
# depend on an outside image service. After the first push, open the Actions
# tab and click "Run workflow" once so the images exist right away.

name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # refresh twice a day
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2563eb&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0284c7
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0c4a6e,#0369a1,#0ea5e9,#67e8f9

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
